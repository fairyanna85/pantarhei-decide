<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="The Council: a sample output of Panta Rhei decide">
<rect width="1200" height="450" rx="14" fill="#14161A"/>
<circle cx="34" cy="34" r="6" fill="#F2B84B"/><text x="52" y="39" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#A9B0BC" letter-spacing="1">THE COUNCIL</text>
<text x="40" y="82" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">THE COUNCIL · Take the startup offer, or stay?            Door: one-way-ish (reversible in ~2 yrs)</text>
<text x="40" y="104" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F2B84B" xml:space="preserve">─────────────────────────────────────────────────────────────────────────────────────</text>
<text x="40" y="126" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">ACTUARY  [formal/empirical]  Comp roughly equal; base rate for senior lateral moves that</text>
<text x="40" y="148" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         are rated &quot;worth it&quot; at 2 years is favourable when role scope grows. → TAKE (0.6)</text>
<text x="40" y="170" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">CORONER  [empirical]         It failed in 18 months because… the org is new and its</text>
<text x="40" y="192" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         leadership churned. Kill criterion: no scope increase by month 9. → TAKE, with exit</text>
<text x="40" y="214" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">SCOUT    [formal]            One call with two people who left that company changes the estimate</text>
<text x="40" y="236" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         more than any other information. Do that before signing. → WAIT ONE WEEK</text>
<text x="40" y="258" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">FUTURE YOU [heuristic]       At 80: regret staying more than regret trying. → TAKE</text>
<text x="40" y="280" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">GUT      [empirical, weak]   Coin landed on STAY; you felt relief that it was a coin. → TAKE</text>
<text x="40" y="302" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F2B84B" xml:space="preserve">─────────────────────────────────────────────────────────────────────────────────────</text>
<text x="40" y="324" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">CHAIR    Take it, after the Scout&#x27;s one-week check.</text>
<text x="40" y="346" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         Dissent: the Scout. Its condition is cheap, so it is adopted, not overruled.</text>
<text x="40" y="368" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         Kill criteria: no scope increase by month 9, or the sponsoring VP leaves.</text>
<text x="40" y="390" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">         Reverses if: the two calls describe churn as structural, not personal.</text>
</svg>